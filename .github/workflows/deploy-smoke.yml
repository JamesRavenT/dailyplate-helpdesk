name: Deploy smoke

# Cloudflare Workers Builds (frontend) and Render (backend) own the deploys; this
# workflow only verifies the result. It waits for the deployed backend to answer
# /health, then runs the deploy-smoke Playwright project against the live site.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: Override the URL to smoke test
        required: false
        type: string

concurrency:
  group: deploy-smoke
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke test the deployment
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      # Every test here targets the deployed site, so SMOKE_ONLY tells the Playwright
      # config to skip its local dev servers. Without it this job would need a Postgres
      # service and the backend and frontend installs just to boot servers it never
      # talks to.
      SMOKE_ONLY: '1'
      DEPLOYED_BASE_URL: ${{ inputs.base_url || vars.DEPLOYED_BASE_URL || secrets.DEPLOYED_BASE_URL }}
      SMOKE_ADMIN_EMAIL: ${{ secrets.SMOKE_ADMIN_EMAIL }}
      SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      # Without a target URL there is nothing to verify. Skip loudly rather than
      # passing green on four vacuously skipped tests.
      - name: Check the target is configured
        id: target
        run: |
          if [ -z "$DEPLOYED_BASE_URL" ]; then
            echo "::warning::DEPLOYED_BASE_URL is not set — skipping the deploy smoke test. Set it as a repository variable to enable this workflow."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # Render's free plan rebuilds the container and cold-starts it, and the previous
      # revision keeps answering throughout — so a 200 alone only proves *something* is
      # up. On a push we additionally wait for /health to report the triggering commit
      # (Render injects RENDER_GIT_COMMIT), otherwise the suite can pass against the
      # revision it was meant to replace. /health also 503s while the pg-boss worker is
      # unhealthy, so only a 200 counts as ready either way.
      #
      # A manual dispatch may target any deployment, so it asserts liveness only.
      - name: Wait for the deployment to become healthy
        if: steps.target.outputs.configured == 'true'
        env:
          EXPECTED_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
        run: |
          if [ -n "$EXPECTED_SHA" ]; then
            echo "Waiting for commit $EXPECTED_SHA at $DEPLOYED_BASE_URL"
          else
            echo "Waiting for any healthy response at $DEPLOYED_BASE_URL (commit not enforced)"
          fi

          # github.sha is the full 40-char SHA; a platform may report an abbreviated
          # one. Treat either being a prefix of the other as a match, with a 7-char
          # floor so a truncated or empty value cannot match everything.
          sha_matches() {
            live="$1"; want="$2"
            [ ${#live} -ge 7 ] || return 1
            case "$want" in "$live"*) return 0 ;; esac
            case "$live" in "$want"*) return 0 ;; esac
            return 1
          }

          deadline=$(( $(date +%s) + 1200 ))
          attempt=0
          last_commit=""
          saw_healthy=false

          until [ "$(date +%s)" -ge "$deadline" ]; do
            attempt=$(( attempt + 1 ))
            status=$(curl -sS -o /tmp/health.json -w '%{http_code}' \
              -H 'Cache-Control: no-cache' \
              "$DEPLOYED_BASE_URL/health?ci=$(date +%s)" || echo 000)

            if [ "$status" = "200" ]; then
              saw_healthy=true
              last_commit=$(jq -r '.commit // empty' /tmp/health.json 2>/dev/null || echo '')

              if [ -z "$EXPECTED_SHA" ] || sha_matches "$last_commit" "$EXPECTED_SHA"; then
                echo "Ready after $attempt attempt(s):"
                cat /tmp/health.json
                exit 0
              fi

              echo "Attempt $attempt: healthy, but running ${last_commit:-<no commit reported>}"
            else
              echo "Attempt $attempt: HTTP $status"
              [ -s /tmp/health.json ] && cat /tmp/health.json
            fi

            sleep 15
          done

          if [ "$saw_healthy" = true ]; then
            echo "::error::$DEPLOYED_BASE_URL is healthy but still serving ${last_commit:-an unreported commit} after 20 minutes; expected $EXPECTED_SHA. The deploy may have failed or never started."
          else
            echo "::error::$DEPLOYED_BASE_URL/health did not return 200 within 20 minutes."
          fi
          exit 1

      - uses: actions/setup-node@v7
        if: steps.target.outputs.configured == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install e2e dependencies
        if: steps.target.outputs.configured == 'true'
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browser
        if: steps.target.outputs.configured == 'true'
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      # The access gate is bypassed inside the fixture, which intercepts the verifier
      # call — no access key is needed here. Without smoke admin credentials the
      # session test skips itself and the rest still run.
      - name: Run the deploy smoke suite
        if: steps.target.outputs.configured == 'true'
        working-directory: e2e
        run: npx playwright test --project=deploy-smoke
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: ${{ steps.target.outputs.configured == 'true' && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: deploy-smoke-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14
          if-no-files-found: ignore
